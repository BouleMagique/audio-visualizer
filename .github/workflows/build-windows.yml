name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release ou uploader l'exe"
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build AudioVisualizer.exe
        run: |
          pyinstaller --onefile --windowed --name AudioVisualizer `
            --add-data "render/shaders;render/shaders" `
            --collect-all moderngl --collect-all glcontext `
            main.py

      # La cible est le tag qui a declenche le build (push de tag), ou celui passe
      # en input (dispatch manuel) — jamais un tag en dur, sinon une rebuild ecrase
      # les assets d'une version deja publiee.
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$env:TAG" dist/AudioVisualizer.exe --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: AudioVisualizer-windows
          path: dist/AudioVisualizer.exe
