name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build AudioVisualizer.exe
        run: |
          pyinstaller --onefile --windowed --name AudioVisualizer `
            --add-data "render/shaders;render/shaders" `
            --collect-all moderngl --collect-all glcontext `
            main.py

      - name: Upload to release v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 dist/AudioVisualizer.exe --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: AudioVisualizer-windows
          path: dist/AudioVisualizer.exe
